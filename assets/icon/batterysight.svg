<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- BatterySight logo: an eye whose iris is a round battery, filled to a level and seen
       through glass. Windows 11 (Fluent) style. Used at 40 px and up; the
       batterysight-NN.svg files are the same drawing fitted to the pixel grid for small sizes.
       Render with resvg (assets/icon/render.py). -->
  <defs>
    <path id="lid" d="M8 128 C56 40 200 40 248 128 C200 216 56 216 8 128 Z"/>
    <path id="white" d="M28 128 C72 62 184 62 228 128 C184 194 72 194 28 128 Z"/>
    <clipPath id="in-white"><use href="#white"/></clipPath>
    <clipPath id="in-lid"><use href="#lid"/></clipPath>
    <clipPath id="in-glass"><circle cx="120" cy="128" r="38"/></clipPath>

    <linearGradient id="lid-fill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#62C1FF"/>
      <stop offset="0.55" stop-color="#2386E3"/>
      <stop offset="1" stop-color="#0B4FA8"/>
    </linearGradient>
    <linearGradient id="lid-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="white-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE9F7"/>
      <stop offset="0.35" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF4FB"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5AB8FF"/>
      <stop offset="0.6" stop-color="#1572D3"/>
      <stop offset="1" stop-color="#0A4A9E"/>
    </linearGradient>
    <linearGradient id="nub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C9BEA"/>
      <stop offset="1" stop-color="#0A4A9E"/>
    </linearGradient>
    <radialGradient id="glass-fill" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEF9"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#A3EC8E"/>
      <stop offset="0.5" stop-color="#4CBB55"/>
      <stop offset="1" stop-color="#1F8A3B"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="drop" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#002A5C" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="iris-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#002A5C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Lid: the eye's outline, lit from the top. -->
  <use href="#lid" fill="url(#lid-fill)" filter="url(#drop)"/>
  <use href="#lid" fill="url(#lid-sheen)"/>
  <path d="M14 126 C60 46 196 46 242 126" fill="none" stroke="#FFFFFF" stroke-opacity="0.45"
        stroke-width="2" clip-path="url(#in-lid)"/>

  <!-- The white of the eye, shaded under the upper lid. -->
  <use href="#white" fill="url(#white-fill)"/>
  <g clip-path="url(#in-white)">
    <path d="M20 112 C72 50 184 50 236 112" fill="none" stroke="#0B3F7E" stroke-opacity="0.22"
          stroke-width="16" filter="url(#soft)"/>

    <!-- Iris: a round battery with its terminal, tucked under the lids. -->
    <g filter="url(#iris-shadow)">
      <rect x="163" y="115" width="18" height="26" rx="6" fill="url(#nub)"/>
      <circle cx="120" cy="128" r="50" fill="url(#ring)"/>
    </g>
    <rect x="166" y="118" width="12" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.35"/>
    <path d="M78 112 A46 46 0 0 1 150 88" fill="none" stroke="#FFFFFF" stroke-opacity="0.45"
          stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="128" r="40" fill="#0A3F86" fill-opacity="0.55"/>

    <!-- Glass with the charge level. -->
    <circle cx="120" cy="128" r="38" fill="url(#glass-fill)"/>
    <g clip-path="url(#in-glass)">
      <path d="M78 134 C94 124 106 124 120 132 C134 140 146 140 164 130 V172 H78 Z" fill="url(#liquid)"/>
      <path d="M78 134 C94 124 106 124 120 132 C134 140 146 140 164 130" fill="none"
            stroke="#D4F7C6" stroke-width="3"/>
      <circle cx="120" cy="128" r="38" fill="none" stroke="#0A3F86" stroke-opacity="0.25"
              stroke-width="6" filter="url(#soft)"/>
    </g>
    <path d="M96 106 A30 30 0 0 1 128 96" fill="none" stroke="url(#glare)" stroke-width="7"
          stroke-linecap="round"/>
    <circle cx="140" cy="102" r="3.5" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>
