# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# The rules live in CONTRIBUTING.md and AGENTS.md; CI enforces what it can. CodeRabbit is a
# second reader. Under 10 stars, start a review with `@coderabbitai review`.
reviews:
  profile: chill
  # Request changes for blocking findings and approve once they are resolved; authors
  # cannot approve their own PR with `@coderabbitai approve`.
  auto_approvals:
    enabled: true
    allow_author_approval: false
  auto_review:
    # Dependency bumps are gated by CI (cargo-deny, the build and the tests).
    ignore_usernames:
      - "dependabot[bot]"
  # Contributions stay written by their authors.
  finishing_touches:
    unit_tests:
      enabled: false
    autofix:
      enabled: false
  path_instructions:
    - path: "crates/core/catalog/**"
      instructions: >-
        Each [[device]] needs name, vid, pids and/or wpids, kind, engine, status and source.
        status is hardware-tested (source names who tested what and when), source-verified
        (source cites a public protocol source with file/line) or community-tested (source
        links a hardware report from outside the project). Flag user names or local paths
        anywhere in the file.
    - path: "crates/core/src/engines/**"
      instructions: >-
        Engines may query a device only on the events listed in README "When BatterySight
        asks a device", and only the scheduler decides when anything is sent; flag new
        periodic queries or anything that could keep a device awake. Behaviour changes need
        a replay test (hidpp_replay.rs or vendor_replay.rs).
    - path: "crates/{win,app}/src/**"
      instructions: >-
        Check handle and COM lifetimes and unsafe blocks; no blocking work on the UI thread;
        no network access.
  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        `area: lowercase summary`, where the area is what the change is about, not every
        directory it touches: core, win, app, cli, catalog, ci, docs, or an engine (hidpp,
        steelseries, hyperx, …). A change that rests equally on two areas names both,
        comma-separated (`core, win: …`).
    custom_checks:
      - name: No personal data
        mode: error
        instructions: >-
          Fail if the PR adds a person's user name or a user profile path to any file.
          Device ids (unit ids, serial numbers) in captures and fixtures are fine. Pass
          otherwise.
      - name: Device entries carry evidence
        mode: warning
        instructions: >-
          Fail if a [[device]] entry is added or its status changed and its source does not
          hold the evidence that status needs (CONTRIBUTING.md, "Adding or fixing a device").
  # Tools for the files this repo has: Rust (clippy skips itself because CI runs it;
  # opengrep and ast-grep run their built-in rules), secrets (gitleaks, trufflehog),
  # workflows (actionlint, zizmor) and CI results (github-checks). Turned off: the
  # Markdown and YAML linters (the repo writes one line per paragraph, so they report
  # only line length), grammar nits, PII patterns that do not occur here, and OSV, which
  # repeats cargo-deny's advisory check on Cargo.lock.
  tools:
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    languagetool:
      enabled: false
    presidio:
      enabled: false
    osvScanner:
      enabled: false
knowledge_base:
  code_guidelines:
    # AGENTS.md is read automatically; CONTRIBUTING.md holds the full rules.
    filePatterns:
      - "CONTRIBUTING.md"
