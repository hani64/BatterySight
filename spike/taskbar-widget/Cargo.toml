[package]
name = "taskbar-widget-spike"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Throwaway spike (Task 2a): taskbar widget as a layered child of Shell_TrayWnd. Not part of the workspace."

# Own workspace root: the repo workspace's `exclude = ["spike/*"]` is not a glob in Cargo, so
# without this table Cargo thinks this crate belongs to the parent workspace.
[workspace]

# WS_EX_LAYERED on a child window needs a manifest that declares Windows 8+ compatibility;
# embed-manifest writes the resource object itself (no rc.exe / windres needed, MSVC or GNU).
[build-dependencies]
embed-manifest = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
