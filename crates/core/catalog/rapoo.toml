# Rapoo VT interrupt input only. No vendor family fallback or command selectors.

[[device]]
name = "Rapoo VT7"
vid = 0x24AE
pids = [0x1413, 0x4613]
kind = "mouse"
engine = "rapoo"
status = "source-verified"
source = "pspfreak/rapoo-mouse-battery README.md (Protocol notes) and MouseMonitor.cs: FF00:0002, 19-byte status 07 on receiver and cable"
receive = { usage_page = 0xFF00, usage = 0x0002, input_len = 19 }
rapoo = { report = "nordic", wired_pid = 0x4613 }

[[device]]
name = "Rapoo VT2 Pro Max"
vid = 0x24AE
pids = [0x1423]
kind = "mouse"
engine = "rapoo"
status = "source-verified"
