# A HUB identifies the CH584 input handler and collection, but gives no fixed
# descriptor input width. The status body has eight required payload bytes.
[[device]]
name = "Rapoo VT1 SE"
vid = 0x24AE
pids = [0x1A11, 0x4A11]
kind = "mouse"
engine = "rapoo"
status = "source-verified"
source = "Rapoo A HUB index-ucvYttFJ.js: VT1 SE manifest default FF00:000F and VT_CH584 (EB.handleReport) input 08"
receive = { usage_page = 0xFF00, usage = 0x000F }
rapoo = { report = "ch584", wired_pid = 0x4A11 }

