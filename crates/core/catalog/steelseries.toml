# Exact USB PID/protocol rows only; no SteelSeries family fallback. `send` also
# receives B0. `receive` selects the separate, input-only event role even when
# that collection advertises an output capability. Windows HIDP_CAPS includes
# the leading ID byte even for unnumbered reports.

[[device]]
name = "SteelSeries Arctis Nova 7 family"
vid = 0x1038
pids = [0x2202, 0x2206, 0x220A, 0x223A, 0x227A, 0x22A4]
kind = "headset"
engine = "steelseries"
status = "source-verified"
source = "HeadsetControl steelseries_arctis_nova_7/7p.hpp (PIDs, 0–4, command); Linux hid-steelseries-arctis.c (quarter steps, if 3/5); Linux-Arctis-Manager nova_7.yaml (event selector)"
receive = { usage_page = 0xFF00, usage = 1, interface = 5 }
send = { usage_page = 0xFFC0, usage = 1, interface = 3, output_len = 65 }
steelseries = "nova7-steps"

