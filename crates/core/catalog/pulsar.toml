# SONiX control uses MI_03 / FFFF:0001, 64 wire bytes plus Windows' ID slot.
# Fusion2 events use MI_01 / Input Report ID 05. No fixed Windows RX usage or
# length is published; the engine checks cached descriptor caps for the ID.
# The cable PIDs and other 3710 protocols are intentionally not admitted here.

[[device]]
name = "Pulsar Fusion2 1K Dongle"
vid = 0x3710
pids = [0x5402]
kind = "mouse"
engine = "sonix"
status = "source-verified"
source = "pulsar-mouse-linux xlite_v4_wireless.py and #21/#28: X3 with 1K receiver, Fusion2 Windows USBPcap and live link/battery traces; research sections 3 and 8"
receive = { interface = 1 }
send = { interface = 3, usage_page = 0xFFFF, usage = 0x0001, feature_len = 65 }

