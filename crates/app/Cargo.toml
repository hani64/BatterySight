[package]
name = "batterysight"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
batterysight-core = { path = "../core" }
batterysight-win = { path = "../win" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"

# The application manifest and the icon (see build.rs). embed-manifest writes the manifest's
# resource object itself; embed-resource compiles the icon with rc.exe (MSVC, from the Windows
# SDK) or windres (GNU binutils).
[build-dependencies]
embed-manifest = "1"
embed-resource = "3"
