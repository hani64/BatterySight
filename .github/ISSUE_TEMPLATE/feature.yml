name: Feature request
description: Suggest a change to what BatterySight does.
labels: [enhancement]
body:
  - type: checkboxes
    id: read
    attributes:
      label: Before you ask
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read "Scope" and "Settled decisions" in CONTRIBUTING.md, and this does not reopen one of them.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
