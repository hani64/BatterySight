name: Device request
description: Ask for support for a wireless device BatterySight does not show.
labels: [device]
body:
  - type: markdown
    attributes:
      value: |
        A device is added once its protocol is confirmed by a public source or tested on hardware (CONTRIBUTING.md, "Adding or fixing a device"). Sources and captures make that much faster.
  - type: input
    id: name
    attributes:
      label: Device
      placeholder: Logitech G Pro X Superlight 2
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [Mouse, Keyboard, Headset, Controller, Other]
    validations:
      required: true
  - type: input
    id: ids
    attributes:
      label: VID:PID
      description: Device Manager → the device (or its receiver) → Properties → Details → Hardware Ids shows `VID_xxxx&PID_xxxx`. List the receiver's too if it has one.
      placeholder: 046D:C547
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      multiple: true
      options: [USB receiver or dongle, Bluetooth, Cable]
    validations:
      required: true
  - type: input
    id: vendor-app
    attributes:
      label: Vendor app that shows its battery
      placeholder: G HUB, Synapse, iCUE, SteelSeries GG, none
  - type: textarea
    id: sources
    attributes:
      label: Protocol sources
      description: Public code or docs that read this device's battery (Linux HID drivers, Solaar, HeadsetControl, OpenRazer, rivalcfg), with links.
  - type: textarea
    id: capture
    attributes:
      label: Capture
      description: Lines from `%LOCALAPPDATA%\BatterySight\sends.log` or a USB capture while the battery level shows or changes. Device ids can stay; they help debugging.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed my user name and local paths from everything above.
          required: true
